<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c1130">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cycle">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cycle Garden</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="preload" href="./fonts/InstrumentSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="phone" data-view="home">
        <div class="sky" id="sky" aria-hidden="true"></div>

        <div class="app view-home" id="app"></div>

        <nav class="bottom-nav" aria-label="Main navigation">
          <button class="nav-item active" type="button" data-view="home" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15.5 4.5a7.5 7.5 0 1 0 4 12.5A6.5 6.5 0 0 1 15.5 4.5z"/>
            </svg>
            <span class="nav-label" data-label="nav.home">今天</span>
          </button>
          <button class="nav-item" type="button" data-view="cycles">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 19V13"/><path d="M10 19V7"/><path d="M15 19v-9"/><path d="M20 19V5"/>
            </svg>
            <span class="nav-label" data-label="nav.cycles">周期</span>
          </button>
          <button class="nav-add" type="button" data-action="open-day" aria-label="记录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5.5v13"/><path d="M5.5 12h13"/>
            </svg>
          </button>
          <button class="nav-item" type="button" data-view="calendar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.8" y="5.2" width="16.4" height="15" rx="3.2"/>
              <path d="M3.8 9.6h16.4"/>
              <path d="M8.2 3.4v3.2"/><path d="M15.8 3.4v3.2"/>
            </svg>
            <span class="nav-label" data-label="nav.calendar">日历</span>
          </button>
          <button class="nav-item" type="button" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 8.5h8"/><path d="M16 8.5h4"/>
              <circle cx="14" cy="8.5" r="2.1"/>
              <path d="M4 15.5h4"/><path d="M12 15.5h8"/>
              <circle cx="10" cy="15.5" r="2.1"/>
            </svg>
            <span class="nav-label" data-label="nav.settings">设置</span>
          </button>
        </nav>

        <div class="sheet-root" id="sheetRoot"></div>
        <div class="lock-root" id="lockRoot" hidden></div>
      </section>
    </main>

    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
